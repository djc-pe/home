  <style>
  :root {
    /* Tipografía */
    --font-base: 'Inter', sans-serif;
    --font-heading: 'Poppins', sans-serif;

    /* Superficies */
    --color-bg: #000000;
    --color-surface: #141414;

    /* Texto */
    --color-text: #FFFFFF;
    --color-text-muted: #9CA3AF;
    --color-text-inverse: #FFFFFF;

    /* Marca */
    --color-primary: #000000;
    --color-accent: #e5f774;

    /* Variantes */
    --color-accent-hover: #e5f774;
    --color-accent-dark: #e5f774;

    /* UI */
    --color-border: #e5f774;
  }

  /* ============ PERFIL ============ */
  .profile {
    display: flex;
    flex-direction: column;
    padding-top: 20px;
  }

  .profile__head {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 20px 16px;
  }

  .profile__avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 4px solid var(--color-surface);
    background: var(--color-accent);
    color: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    font-family: var(--font-heading);
    flex-shrink: 0;
  }

  .profile__info {
    padding-bottom: 8px;
    min-width: 0;
  }

  .profile__info h1 {
    margin: 0;
    font-family: var(--font-heading);
    font-size: 24px;
    color: var(--color-text);
  }

  .profile__username {
    margin: 2px 0 4px;
    color: var(--color-accent);
    font-size: 15px;
  }

  .profile__meta {
    margin: 0;
    color: var(--color-text-muted);
    font-size: 13px;
  }

  /* ============ PRESENTACIÓN ============ */
  .presentacion {
    margin: 24px 0 8px;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    background: var(--color-surface);
    padding: 18px 20px;
  }

  .presentacion h2 {
    margin: 0;
    font-family: var(--font-heading);
    font-size: 18px;
    color: var(--color-accent);
  }

  .presentacion__texto {
    margin: 14px 0 0;
    line-height: 1.6;
    color: var(--color-text);
    white-space: pre-line;
  }

  @media (max-width: 600px) {
    .profile { padding-top: 12px; }
    .profile__avatar { width: 72px; height: 72px; font-size: 28px; border-width: 3px; }
    .profile__head { gap: 12px; padding: 0 14px 14px; }
    .profile__info h1 { font-size: 20px; }
    .presentacion { margin: 18px 0 8px; }
  }
  </style>
